name: CI

on:
  push:
    branches: [main]
  pull_request:

# A read-only token for every job: nothing here pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs with the tag in the trailing comment; the
# github-actions entry in .github/dependabot.yml keeps the SHAs current.
jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `prepare:assets` copies the Tesseract and MediaPipe runtimes and downloads the
      # .tflite models (network access is fine on GitHub-hosted runners), then `vite build`.
      - run: npm run build

  smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Detection needs the self-hosted models. The smoke draws its own fixture in the
      # browser and extends it with scripts/make-exif-fixture.mjs, so no git-ignored file
      # under public/test/ is needed.
      - run: npm run prepare:assets

      # The runner image ships Google Chrome; scripts/smoke.mjs drives it through
      # playwright-core (SMOKE_BROWSER_PATH), so no Playwright browser is downloaded.
      - run: google-chrome --version

      - name: Start the dev server
        run: |
          npm run dev -- --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"
          for _ in $(seq 1 60); do
            if curl -sSf -o /dev/null http://localhost:5173/; then
              exit 0
            fi
            sleep 1
          done
          echo "the dev server did not answer within 60 s"
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Run the smoke
        env:
          SMOKE_URL: http://localhost:5173
          SMOKE_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run smoke

      - name: Dev server log
        if: failure()
        run: cat "$RUNNER_TEMP/vite.log"

      - name: Stop the dev server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true
          fi
          pkill -f 'vite --port 5173' 2>/dev/null || true
