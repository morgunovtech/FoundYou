<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The locale-dependent head — title, description, canonical, hreflang, Open Graph, Twitter,
         JSON-LD — is rendered here from the dictionary for each of the three pages (/, /en/, /uz/)
         by localePages() in vite.config.ts (src/site/renderStatic.ts); the marker must stay. -->
    <!-- fy:head -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Morgunov Tech" />

    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#edeae5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <!-- No app-capable metas: the manifest says `display: browser` on purpose (see docs/service-worker-2026-09-20.md),
         and the Apple meta is the legacy switch that would open a home-screen shortcut full-screen anyway. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Verification placeholders (replace with real codes) -->
    <!-- <meta name="google-site-verification" content="YOUR_CODE" /> -->
    <!-- <meta name="yandex-verification" content="YOUR_CODE" /> -->

    <!-- morgunov.tech design system v1 — critical subset inlined so the first
         paint is already themed; the full layer follows as render-blocking CSS.
         Source of truth: public/ds/v1/*.css (mirrors about-me-page/ds/v1). -->
    <style>
      :root{--v4-bg:#edeae5;--v4-paper:#f5f2ed;--v4-fg:#14110d;--v4-muted:#5a554c;--v4-dim:#6c6759;--v4-line:#c9c5bd;--v4-line-soft:#d8d4cc;--v4-orange:#d9531e;--v4-orange-text:#b03e10;--v4-on-accent:#14110d;--v4-on-fg:#f5f2ed;--v4-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;--v4-sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;--v4-label-size:11px;--v4-label-tracking:.1em;--v4-label-xs-size:10px;--v4-label-xs-tracking:.12em;--v4-label-weight:500;color-scheme:light dark}
      [data-theme="dark"]{--v4-bg:#14130f;--v4-paper:#1c1a16;--v4-fg:#ece7dd;--v4-muted:#b8b0a2;--v4-dim:#8a8378;--v4-line:#3a3530;--v4-line-soft:#2a2620;--v4-orange:#ff6a2e;--v4-orange-text:#ff6a2e;--v4-on-accent:#14130f;--v4-on-fg:#14130f;color-scheme:dark}
      [data-theme="high-contrast"]{--v4-bg:#000;--v4-paper:#0a0a0a;--v4-fg:#fff;--v4-muted:#f1eee7;--v4-dim:#d6d0c8;--v4-line:#fff;--v4-line-soft:#c8c8c8;--v4-orange:#ffd166;--v4-orange-text:#ffd166;--v4-on-accent:#000;--v4-on-fg:#000;color-scheme:dark}
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0}
      body.no-transition,body.no-transition *{transition:none!important}
      body.v4-page{background:var(--v4-bg);color:var(--v4-fg);font-family:var(--v4-sans);font-size:14px;line-height:1.55;letter-spacing:-0.005em}
      [data-theme="high-contrast"] body.v4-page{font-size:16px}
      .v4-page .skip-link{position:fixed;top:-10rem;left:16px;background:var(--v4-orange);color:var(--v4-on-accent);padding:6px 12px;z-index:100;text-decoration:none;font-size:13px;transition:top .2s}
      .v4-page .skip-link:focus{top:8px}
    </style>

    <!-- Theme before first paint (shared mechanism with morgunov.tech). The
         legacy key of the pre-DS build is migrated in place. -->
    <script src="/theme-init.js"></script>

    <!-- Fonts above the fold: sans 400/500/600 (cyr + latin), mono 400 (eyebrow, labels). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-cyr-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-cyr-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-latin-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-mono-cyr-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-mono-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-cyr-500.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-latin-500.woff2" crossorigin />

    <!-- Design-system layer, load order matters: fonts → tokens → base → components.
         The ?v= stamps are replaced with content hashes at build time (vite.config.ts). -->
    <link rel="stylesheet" href="/ds/v1/fonts.css?v=dev" />
    <link rel="stylesheet" href="/ds/v1/tokens.css?v=dev" />
    <link rel="stylesheet" href="/ds/v1/base.css?v=dev" />
    <link rel="stylesheet" href="/ds/v1/components.css?v=dev" />

  </head>
  <body class="v4-page no-transition">
    <div id="root">
      <!-- The static copy of the page for a reader that runs no JavaScript — an AI assistant, a
           text-only crawler, a link unfurler: the hero, the site copy, the «how to check» block
           and the footer, in this page's language, rendered from the dictionary at build time
           (src/site/renderStatic.ts). React clears the container on mount and renders the same
           copy from the same model. src/__tests__/site/localePages.test.ts pins it. -->
      <!-- fy:static -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
