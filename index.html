    <!-- morgunov.tech design system v1 — critical subset inlined so the first
         paint is already themed; the full layer follows as render-blocking CSS.
         Source of truth: public/ds/v1/*.css (mirrors about-me-page/ds/v1). -->
    <style>
      :root{--v4-bg:#edeae5;--v4-paper:#f5f2ed;--v4-fg:#14110d;--v4-muted:#5a554c;--v4-dim:#6c6759;--v4-line:#c9c5bd;--v4-line-soft:#d8d4cc;--v4-orange:#d9531e;--v4-orange-text:#b03e10;--v4-on-accent:#14110d;--v4-on-fg:#f5f2ed;--v4-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;--v4-sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;--v4-label-size:11px;--v4-label-tracking:.1em;--v4-label-xs-size:10px;--v4-label-xs-tracking:.12em;--v4-label-weight:500;color-scheme:light dark}
      [data-theme="dark"]{--v4-bg:#14130f;--v4-paper:#1c1a16;--v4-fg:#ece7dd;--v4-muted:#b8b0a2;--v4-dim:#8a8378;--v4-line:#3a3530;--v4-line-soft:#2a2620;--v4-orange:#ff6a2e;--v4-orange-text:#ff6a2e;--v4-on-accent:#14130f;--v4-on-fg:#14130f;color-scheme:dark}
      [data-theme="high-contrast"]{--v4-bg:#000;--v4-paper:#0a0a0a;--v4-fg:#fff;--v4-muted:#f1eee7;--v4-dim:#d6d0c8;--v4-line:#fff;--v4-line-soft:#c8c8c8;--v4-orange:#ffd166;--v4-orange-text:#ffd166;--v4-on-accent:#000;--v4-on-fg:#000;color-scheme:dark}
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0}
      body.no-transition,body.no-transition *{transition:none!important}
      body.v4-page{background:var(--v4-bg);color:var(--v4-fg);font-family:var(--v4-sans);font-size:14px;line-height:1.55;letter-spacing:-0.005em}
      [data-theme="high-contrast"] body.v4-page{font-size:16px}
      .v4-page .skip-link{position:fixed;top:-10rem;left:16px;background:var(--v4-orange);color:var(--v4-on-accent);padding:6px 12px;z-index:100;text-decoration:none;font-size:13px;transition:top .2s}
      .v4-page .skip-link:focus{top:8px}
    </style>

    <!-- Structured Data: WebApplication (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Found You",
      "alternateName": "Meta Data Insight",
      "url": "https://foundyou.morgunov.tech/",
      "image": "https://foundyou.morgunov.tech/images/og-card-en.png",
      "description": "Free privacy-focused tool to analyze and remove metadata from photos. Extracts EXIF, GPS and camera info, performs OCR and detects people and objects. The photo never leaves your browser; place context is looked up only on request, from rounded coordinates.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any (browser-based)",
      "browserRequirements": "Requires JavaScript and WebAssembly",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "EXIF/XMP/IPTC/ICC metadata extraction",
        "GPS location visualization on map",
        "Face and object detection with blurring",
        "OCR text recognition (Russian + English)",
        "Metadata removal and photo cleanup",
        "Anti-reverse-image-search protection",
        "PRNU fingerprint removal",
        "HEIC/HEIF format support",
        "Photo processed locally — never uploaded; opt-in place context from rounded coordinates",
        "Verified cleanup: the exported file is re-parsed and shown to contain 0 metadata fields"
      ],
      "inLanguage": ["ru", "en", "uz"],
      "creator": {
        "@type": "Organization",
        "name": "Morgunov Tech",
        "url": "https://morgunov.tech"
      },
      "datePublished": "2024-06-01"
    }
    </script>

    <!-- Structured Data: FAQPage for rich snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Безопасно ли загружать фото в Found You?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Да. Фотография обрабатывается локально в вашем браузере и никогда не отправляется на сервер: извлечение метаданных, OCR, детекция людей и объектов, размытие и очистка происходят на вашем устройстве. Единственное исключение — блок «Контекст места»: если вы сами нажмёте «Показать контекст места», на наш сервер уйдут только округлённые координаты (точность около 11 м) и дата и время съёмки, чтобы показать адрес, погоду и объекты поблизости. Само фото не отправляется и в этом случае."
          }
        },
        {
          "@type": "Question",
          "name": "Какие метаданные можно извлечь из фотографии?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Found You извлекает EXIF (камера, дата, настройки съёмки), GPS-координаты, XMP, IPTC (авторские права, описания), ICC (цветовой профиль), а для PNG — текстовые чанки, включая prompt AI-генераторов. Также распознаёт текст на фото (OCR) и обнаруживает людей и объекты."
          }
        },
        {
          "@type": "Question",
          "name": "Is Found You free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Found You is completely free. It works in your browser with no registration and no uploads; files up to 20 MB and 40 megapixels are supported. All processing is done locally on your device, and place context is fetched only if you ask for it."
          }
        }
      ]
    }
    </script>
